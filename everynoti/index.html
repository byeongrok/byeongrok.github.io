<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EveryNoti</title>
  <meta name="description" content="할일·습관·알람을 한 곳에서 관리하는 알림 앱" />
  <link rel="icon" href="icon.png" />
  <style>
    :root { --brand: #4566E0; --text: #1f2937; --muted: #6b7280; --bg: #f9fafb; --card: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --brand: #6B85E8; --text: #f3f4f6; --muted: #9ca3af; --bg: #111827; --card: #1f2937; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      line-height: 1.6;
    }
    main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
    header { text-align: center; margin-bottom: 32px; }
    header img { width: 112px; height: 112px; border-radius: 24px; }
    h1 { margin: 0 0 4px; font-size: 26px; }
    header h1 { margin-top: 16px; font-size: 28px; }
    .lead, .tagline { margin: 0 0 24px; color: var(--muted); }
    section { background: var(--card); border-radius: 16px; padding: 20px 24px; margin-bottom: 16px; }
    h2 { margin: 0 0 8px; font-size: 17px; color: var(--brand); }
    section p { margin: 0 0 8px; }
    section p:last-child { margin-bottom: 0; }
    ol, ul { margin: 0 0 8px; padding-left: 20px; }
    ol:last-child, ul:last-child { margin-bottom: 0; }
    a { color: var(--brand); }
    .note { font-size: 14px; color: var(--muted); }
    footer { text-align: center; font-size: 13px; color: var(--muted); margin-top: 32px; }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="icon.png" alt="EveryNoti 아이콘" />
      <h1>EveryNoti</h1>
      <p class="tagline">할일·습관·알람을 한 곳에서</p>
    </header>

    <section>
      <h2>주요 기능</h2>
      <ul>
        <li>할일 · 일정 · 알람 · 습관을 하나의 앱에서 관리</li>
        <li>매일, 요일별, 매월, N일 간격 등 다양한 반복 설정</li>
        <li>완료 / 건너뛰기 / 다시 알림으로 유연한 일정 관리</li>
        <li>캘린더에서 한눈에 보는 기록과 습관 연속 달성일</li>
        <li>로그인하면 클라우드 동기화로 여러 기기에서 사용</li>
      </ul>
    </section>

    <section>
      <h2>문의 및 정책</h2>
      <ul>
        <li><a href="privacy.html">개인정보처리방침</a></li>
        <li><a href="terms.html">이용약관</a></li>
        <li><a href="delete-account.html">계정 삭제 방법</a></li>
        <li>문의: <a href="mailto:kbre713@gmail.com">kbre713@gmail.com</a></li>
      </ul>
    </section>

    <footer>© 2026 byeongrok</footer>
  </main>
</body>
</html>
